[project]
name = "eyeboard"
version = "0.2.0"
description = "EyeBoard Streamlit app with reusable dashboard templates (uv-managed)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.32",
  "pandas>=2.0",
  "plotly>=5.18",
]

[tool.uv]
# Keep this project lightweight; no build backend is needed since we run it as an app.

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/app.py" = ["E402"]
