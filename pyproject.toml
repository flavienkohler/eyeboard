[project]
name = "eyeboard"
version = "0.2.0"
description = "EyeBoard: explore time-series CSV files, build reusable plot dashboards and compare datasets."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Flavien Kohler" }]
keywords = ["csv", "time series", "dashboard", "streamlit", "plotly", "data exploration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "streamlit>=1.49",
  "pandas>=2.2.2",
  "plotly>=5.18",
  "pydantic>=2.7",
  "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/flavienkohler/eyeboard"
Source = "https://github.com/flavienkohler/eyeboard"
Issues = "https://github.com/flavienkohler/eyeboard/issues"
Changelog = "https://github.com/flavienkohler/eyeboard/blob/main/CHANGELOG.md"

[project.scripts]
eyeboard = "eyeboard.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyeboard"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is handled by `ruff format`; long UI strings are not split by it.
ignore = ["E501"]
