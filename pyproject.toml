[project]
name = "eyeboard"
version = "0.2.0"
description = "EyeBoard: explore time-series CSV files, build reusable plot dashboards and compare datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.49",
  "pandas>=2.2.2",
  "plotly>=5.18",
  "pydantic>=2.7",
]

[project.scripts]
eyeboard = "eyeboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyeboard"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is handled by `ruff format`; long UI strings are not split by it.
ignore = ["E501"]
